name: gonogo
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' 

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  get_it: ^7.6.0
  http: ^1.2.0                    
  cloudinary_flutter: ^1.0.0      
  cloudinary_url_gen: ^1.0.0      
  cupertino_icons: ^1.0.8 
  auto_size_text: ^3.0.0 
  firebase_core: ^4.2.0
  brasil_fields: ^1.18.0
  cloud_firestore: ^6.0.3
  mask_text_input_formatter: ^2.4.0
  firebase_storage: ^13.0.3
  firebase_auth: ^6.1.1
  flutter_tts: ^4.2.3
  syncfusion_flutter_xlsio: ^31.2.3
  universal_html: ^2.2.4
  open_file: ^3.5.10
  path_provider: ^2.1.5
  image_picker: ^1.2.0 
  intl: ^0.20.2 
  shared_preferences: ^2.5.3 
  fluttertoast: ^9.0.0
  google_fonts: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 

  flutter_launcher_icons: ^0.14.4 
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/Logo.png"

  android_12:
    color: "#FFFFFF"
    image: assets/images/Logo.png

  android: true
  ios: true
  web: false

  fullscreen: true

flutter:
  uses-material-design: true
  generate: true 
  assets:
    - assets/images/FotoAdd.jpg
    - assets/images/Fundo1.png
    - assets/images/Fundo2.png
    - assets/images/Fundo3.png
    - assets/images/Logo.png
    - assets/images/click.png     
    - assets/images/Fala.png     
    - assets/images/Troféu.png
    - assets/images/menino.png
    - assets/images/menina.png
    - assets/images/logo_gdppi.png
    - assets/audios/audionum.mp3
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Black.ttf
          weight: 900
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/Raleway-Regular.ttf
    - family: Montserrat 
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
        - asset: assets/fonts/Montserrat-Light.ttf
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
        - asset: assets/fonts/RobotoCondensed-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/gonogo_icon.png"
  min_sdk_android: 21 
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/gonogo_icon.png"