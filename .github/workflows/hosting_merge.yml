name: Firebase Hosting Merge
'on':
  push:
    branches:
      - BugsFix
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar ambiente do Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar Dependências
        run: flutter pub get

      - name: Executar flutter build web
        run: flutter build web --release 

      - name: Implantação no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GONOGO }}'
          channelId: live
          projectId: 'gonogo-2cbd3'