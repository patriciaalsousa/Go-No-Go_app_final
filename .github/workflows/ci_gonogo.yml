name: GoNoGo CI

on:
  push:
    branches:
      - "BugsFix" # branch que vai receber o push
  pull_request:
    branches:
      - "develop" # branch que vai receber o pr

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Procurar Erros/Warnings
        run: flutter analyze

      - name: Rodar /Testes
        run: flutter test
