name: Firebase Hosting Pull Request
'on': pull_request
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar ambiente do Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar Dependências
        run: flutter pub get

      - name: Executar flutter build web
        run: flutter build web --release 

      - name: Implantação no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GONOGO }}'
          projectId: 'gonogo-2cbd3'